<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="loginPage.title">Connexion - NutriFAQ-Chat</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/01-foundation.css">
    <link rel="stylesheet" href="/static/css/02-layout-shell.css">
    <link rel="stylesheet" href="/static/css/03-instructions-and-sidebar.css">
    <link rel="stylesheet" href="/static/css/04-chat-and-input.css">
    <link rel="stylesheet" href="/static/css/05-download-publish-auth.css">
    <link rel="stylesheet" href="/static/css/06-voice-tts.css">
    <link rel="stylesheet" href="/static/css/07-empty-state-cards.css">
    <link rel="stylesheet" href="/static/css/08-cookie-and-mobile.css">
</head>
<body class="login-page">
    <div class="login-page-overlay">
        <div class="login-page-card">
            <div class="login-page-branding">
                <img src="/static/logos/logo-imx.png" alt="IMX Technologie" class="login-page-logo">
                <p class="login-page-product-tag">NutriFAQ-Chat</p>
                <h1 data-i18n="loginPage.heading">Bienvenue</h1>
                <p data-i18n="loginPage.description">Connectez-vous avec votre courriel et votre mot de passe pour continuer.</p>
            </div>
            <form id="login-page-form" class="login-page-form">
                <div class="login-page-field">
                    <label for="login-page-email" data-i18n="loginPage.emailLabel">Courriel</label>
                    <input id="login-page-email" name="email" type="email" autocomplete="username" required />
                </div>
                <div class="login-page-field">
                    <label for="login-page-password" data-i18n="loginPage.passwordLabel">Mot de passe</label>
                    <input id="login-page-password" name="password" type="password" autocomplete="current-password" required />
                </div>
                <button id="login-page-signin" type="submit" class="dm-btn primary" data-i18n="loginPage.signIn">Se connecter</button>
            </form>
            <p id="login-page-status" class="status-message" data-i18n="loginPage.ready">Prêt.</p>
        </div>
    </div>

    <script src="/static/js/auth-config.js"></script>
    <script src="/static/js/login-page.js"></script>
</body>
</html>
